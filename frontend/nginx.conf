# Plain HTTP exists only to redirect to HTTPS — nothing is served over it.
# nginx's $host strips the port unconditionally, so a bare `https://$host`
# redirect silently targets the *default* HTTPS port (443) — correct when the
# container's 80/443 are published 1:1 (the real docker-compose.yml), but
# wrong the moment HTTPS is published on a non-standard host port (e.g. a
# second stack sharing this host, or any reverse-proxy topology that remaps
# ports). __HTTPS_PORT_SUFFIX__ is replaced by entrypoint.sh at container
# start from $HTTPS_PORT_SUFFIX — empty by default (443, no change in
# behavior for the standard deployment), or e.g. ":8443" to match a remapped
# port.
# Deliberately 302, NOT 301: browsers cache a 301 near-permanently, so a
# single bad redirect (e.g. one pointing at the wrong port) survives in every
# user's browser long after the server is fixed, and can only be cleared by
# hand. 302 + no-store keeps the redirect target changeable — the tiny cost
# is one extra request per session, which is irrelevant here since this
# server block only ever issues a redirect.
server {
    listen 80;
    server_name _;
    add_header Cache-Control "no-store" always;
    return 302 https://$host__HTTPS_PORT_SUFFIX__$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Defense-in-depth response headers — the SPA is static, so a fairly
    # strict CSP is safe: no inline scripts, no third-party origins needed
    # since /api/ is same-origin through this same server.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints every built asset (index-<hash>.js), so the filename
    # itself changes whenever the content does — these can safely be cached
    # forever, and `immutable` stops the browser even revalidating them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header replaces the inherited set, so the security headers above
        # must be repeated in any location that adds its own.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # index.html must NEVER be cached without revalidation: it is the only
        # file whose name is stable, and it is what points at the fingerprinted
        # bundles above. With no Cache-Control at all (the previous behaviour)
        # browsers apply heuristic caching and happily keep serving a stale
        # index.html — which silently pins the user to an old deployment and
        # can only be cleared by a manual hard-refresh. `no-cache` still allows
        # storage, it just forces an ETag revalidation each load, so the normal
        # cost is a 304 rather than a full re-download.
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
